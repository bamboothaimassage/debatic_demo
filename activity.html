<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Debatic — กิจกรรม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<div id="root"></div>
<script src="shared/app.js"></script>
<script>

let notifications = loadNotifications();
let activity = loadActivityLog();
let markets = loadMarkets();
let balance = loadBalance();
const sessionUser = Session.current();
document.getElementById('root').innerHTML = traderShell(null, sessionUser, balance, sessionUser && notifications.some(n=>!n.read));
document.getElementById('view').innerHTML = `
  <div class="view-header"><h1>กิจกรรม</h1><div class="sub">ฟีดกิจกรรมสดจากทุกตลาด</div></div>
  <div class="card" style="padding:4px 14px;">${activity.map(a=>activityItem(a, markets)).join('')}</div>
`;
wireSearch();

</script>
</body>
</html>
